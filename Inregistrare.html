<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mesaj vocal · Caiet de ucenicie</title>
<!--
  Pagina de înregistrare a mesajelor vocale pentru Caietul de ucenicie (Biserica Betel Constanța).
  De ce există: Google rulează aplicațiile Apps Script într-un cadru (iframe) fără permisiunea „microphone”,
  așa că microfonul nu poate fi folosit acolo. Pagina aceasta se publică separat (de exemplu pe GitHub Pages),
  se deschide din aplicație într-o filă nouă, înregistrează și trimite fișierul înapoi aplicației (postMessage),
  apoi se închide. Nu încarcă nimic pe internet și nu păstrează înregistrarea.
  Adresa ei se trece în aplicație la Administrare → Setări → „Pagina de înregistrare a mesajelor vocale”.
-->
<style>
  :root { --ink: #1D2B4F; --ink-2: #4A5672; --page: #E8ECF2; --sheet: #FCFDFE; --line: #C8D1DF; --danger: #A3352A; --ok: #3F6E2C; --focus: #2F62CC; }
  @media (prefers-color-scheme: dark) { :root { --ink: #E3E8F1; --ink-2: #A9B3C7; --page: #0F1626; --sheet: #161F33; --line: #2B3651; --danger: #F2988A; --ok: #A5CF88; --focus: #8FB0FF; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 17px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; max-width: 480px; margin: 0 auto; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  h1 { margin: 0; font-size: 1.375rem; }
  p { margin: 0; color: var(--ink-2); }
  .rec { width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); }
  .rec svg { width: 56px; height: 56px; }
  .rec.on { animation: pulse 1.2s ease-in-out infinite; }
  .rec:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @keyframes pulse { 50% { transform: scale(.94); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }
  .time { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  audio { width: 100%; }
  .err { color: var(--danger); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Mesaj vocal</h1>
  <p id="hint">Atinge butonul roșu ca să începi. Poți vorbi cel mult 3 minute.</p>
  <button class="rec" id="rec" type="button" aria-label="Începe înregistrarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a2.8 2.8 0 00-2.8 2.8v5.4a2.8 2.8 0 005.6 0V6.3A2.8 2.8 0 0012 3.5z M6.5 11a5.5 5.5 0 0011 0 M12 16.5v4"/></svg>
  </button>
  <div class="time" id="time" aria-live="polite">0:00</div>
  <audio id="play" controls hidden></audio>
  <div class="row" id="after" hidden>
    <button class="btn" id="again" type="button">Înregistrează din nou</button>
    <button class="btn primary" id="send" type="button">Trimite în conversație</button>
  </div>
  <button class="btn" id="cancel" type="button">Renunță</button>
  <p class="err" id="err" role="alert" hidden></p>
</main>
<script>
(function () {
  'use strict';
  var q = {};
  location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  // înregistrarea pleacă doar înapoi către aplicația care a deschis pagina (un cadru Apps Script)
  var ORIGIN = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/.test(q.o || '') ? q.o : '';
  var NONCE = /^[a-z0-9]{8,40}$/i.test(q.n || '') ? q.n : '';
  var MAX = Math.min(600, Math.max(10, parseInt(q.max, 10) || 180));
  var $ = function (id) { return document.getElementById(id); };
  var rec = $('rec'), time = $('time'), play = $('play'), after = $('after'), err = $('err'), hint = $('hint');
  var mr = null, stream = null, chunks = [], blob = null, t0 = 0, timer = null, fmt = null;

  function fail(msg) { err.textContent = msg; err.hidden = false; }
  if (!ORIGIN || !NONCE || !window.opener) {
    rec.disabled = true;
    fail('Deschide această pagină din aplicație: Mesaje → agrafa → Audio → Înregistrează un mesaj vocal.');
    return;
  }
  var types = [['audio/webm;codecs=opus', 'webm'], ['audio/ogg;codecs=opus', 'ogg'], ['audio/mp4', 'm4a']];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) fmt = types.filter(function (t) { return MediaRecorder.isTypeSupported(t[0]); })[0];
  if (!navigator.mediaDevices || !window.MediaRecorder || !fmt) { rec.disabled = true; fail('Acest browser nu poate înregistra. Încearcă în Chrome sau Safari, actualizate.'); return; }

  function tick() {
    var s = Math.floor((Date.now() - t0) / 1000);
    time.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    if (s >= MAX) stop();
  }
  function start() {
    err.hidden = true; blob = null; play.hidden = true; after.hidden = true;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s; chunks = [];
      mr = new MediaRecorder(s, { mimeType: fmt[0], audioBitsPerSecond: 32000 });
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(timer);
        rec.classList.remove('on'); rec.setAttribute('aria-label', 'Începe înregistrarea');
        blob = new Blob(chunks, { type: fmt[0].split(';')[0] });
        play.src = URL.createObjectURL(blob); play.hidden = false; after.hidden = false;
        hint.textContent = 'Ascultă înregistrarea și trimite-o sau înregistrează din nou.';
      };
      mr.start(1000);
      t0 = Date.now(); timer = setInterval(tick, 250); tick();
      rec.classList.add('on'); rec.setAttribute('aria-label', 'Oprește înregistrarea');
      hint.textContent = 'Se înregistrează… Atinge din nou ca să oprești.';
    }).catch(function (e) {
      fail(e && e.name === 'NotAllowedError'
        ? 'Microfonul nu este permis. Atinge lacătul de lângă adresa paginii → Permisiuni → Microfon → Permite, apoi încearcă din nou.'
        : 'Microfonul nu poate fi folosit acum (' + (e && e.name || 'eroare') + ').');
    });
  }
  function stop() { if (mr && mr.state !== 'inactive') mr.stop(); }
  rec.addEventListener('click', function () { if (mr && mr.state === 'recording') stop(); else start(); });
  $('again').addEventListener('click', start);
  $('send').addEventListener('click', function () {
    if (!blob) return;
    blob.arrayBuffer().then(function (buf) {
      window.opener.postMessage({ tip: 'nota-vocala', n: NONCE, mime: fmt[0].split(';')[0], ext: fmt[1], date: buf }, ORIGIN, [buf]);
      hint.textContent = 'Trimis. Te întorci în aplicație…';
      setTimeout(function () { window.close(); }, 300);
    }).catch(function () { fail('Înregistrarea nu a putut fi trimisă.'); });
  });
  $('cancel').addEventListener('click', function () {
    stop();
    try { window.opener.postMessage({ tip: 'renunta', n: NONCE }, ORIGIN); } catch (e) { /* aplicația s-a închis */ }
    window.close();
  });
})();
</script>
</body>
</html>
